apis:
  - aid: satellogic:aleph-v2-orders-api
    name: Satellogic Aleph V2 Orders API
    description: >-
      Unified Orders API in Aleph V2 that consolidates archive purchases and
      new-capture tasking into a single REST surface. Supports archive
      products, POI (point-of-interest) tasking, and AOI (area-of-interest)
      tasking with end-to-end order lifecycle management, observable events
      across creation, scheduling, capture, processing, and delivery, and
      improved failure diagnostics. Authenticated via OAuth 2.0 Client
      Credentials.
    humanURL: https://developers.satellogic.com/aleph-v2/introduction.html
    tags:
      - Order
      - Tasking
      - Archive
      - Earth Observation
    tags_raw:
      - Orders
      - Tasking
      - Archive
      - Earth Observation
    properties:
      - type: Documentation
        url: https://developers.satellogic.com/aleph-v2/introduction.html
      - type: Documentation
        url: https://developers.satellogic.com/aleph-v2/api/api_v2_specs.html
      - type: Documentation
        url: https://developers.satellogic.com/aleph-v2/api/adoption_guide_enhanced.html
  - aid: satellogic:aleph-v1-tasking-api
    name: Satellogic Aleph V1 Tasking API
    description: >-
      Legacy Aleph V1 Tasking API for submitting and tracking imagery
      collection orders against the Satellogic NewSat constellation. Supports
      multiple tasking product types defined by geometry (point, polygon) and
      collection logic (single, recurring, monitoring) and returns task
      status across feasibility, scheduling, capture, and delivery stages.
    humanURL: https://developers.satellogic.com/tasking-service/introduction.html
    tags:
      - Tasking
      - Imagery
      - Earth Observation
    properties:
      - type: Documentation
        url: https://developers.satellogic.com/tasking-service/introduction.html
      - type: Documentation
        url: https://developers.satellogic.com/tasking-service/tasking_api_spec.html
      - type: Documentation
        url: https://doc.api.satellogic.com/tasking-service/description.html
  - aid: satellogic:aleph-v1-archive-api
    name: Satellogic Aleph V1 Archive API
    description: >-
      Search and order historical Satellogic imagery from the archive,
      including L1 Basic (L1B) multispectral products and hyperspectral
      products. Provides catalog discovery by AOI, date range, cloud cover,
      and product type, returning STAC-style scene metadata that can be
      converted into archive orders.
    humanURL: https://developers.satellogic.com/aleph-v1/archive-api/archive_api_spec.html
    tags:
      - Archive
      - Catalog
      - Imagery
      - Earth Observation
    properties:
      - type: Documentation
        url: https://developers.satellogic.com/aleph-v1/archive-api/archive_api_spec.html
      - type: Documentation
        url: https://developers.satellogic.com/imagery-products/l1basic.html
      - type: Documentation
        url: https://developers.satellogic.com/imagery-products/hyperspectral.html
  - aid: satellogic:aleph-v1-analysis-api
    name: Satellogic Aleph V1 Analysis API
    description: >-
      Feasibility analysis API that lets customers evaluate the likelihood
      and timing of a prospective tasking request — including pass
      opportunities, sun and look-angle constraints, and expected revisit
      cadence — before committing it as a paid tasking order.
    humanURL: https://developers.satellogic.com/aleph-v1/introduction.html
    tags:
      - Analysis
      - Feasibility
      - Tasking
    properties:
      - type: Documentation
        url: https://developers.satellogic.com/aleph-v1/introduction.html
  - aid: satellogic:aleph-v1-delivery-api
    name: Satellogic Aleph V1 Delivery API
    description: >-
      Asset retrieval API for downloading processed imagery products and
      derived artifacts once a tasking or archive order is fulfilled.
      Provides scene listings, signed download URLs, and delivery status
      across L1B, hyperspectral, and other product types.
    humanURL: https://developers.satellogic.com/delivery-service/delivery_api_spec.html
    tags:
      - Delivery
      - Downloads
      - Imagery
    properties:
      - type: Documentation
        url: https://developers.satellogic.com/delivery-service/delivery_api_spec.html
  - aid: satellogic:aleph-authentication-api
    name: Satellogic Aleph Authentication API
    description: >-
      OAuth 2.0 Client Credentials flow used by all Aleph APIs. Customers
      generate API credentials inside the Aleph web platform
      (aleph.satellogic.com), exchange them at
      auth.platform.satellogic.com/oauth/token for an access token valid for
      24 hours, then call product APIs under api.satellogic.com using their
      contract ID.
    humanURL: https://developers.satellogic.com/api-authentication/getting_started.html
    tags:
      - Authentication
      - Security
    tags_raw:
      - Authentication
      - OAuth
