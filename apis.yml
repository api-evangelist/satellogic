aid: satellogic
name: Satellogic
description: >-
  Satellogic is an Argentine-founded, U.S.-listed (NASDAQ: SATL) vertically
  integrated Earth observation company that designs, builds, and operates its
  own NewSat constellation to deliver sub-meter, high-frequency multispectral
  and hyperspectral satellite imagery. Its commercial platform Aleph unifies
  archive search, tasking, analysis, and delivery into a single web and API
  experience, available in both the legacy Aleph V1 (Tasking, Archive,
  Analysis, Delivery APIs) and the unified Aleph V2 Orders API. Satellogic
  also markets Aleph Observer for persistent daily monitoring of designated
  sites, Constellation-as-a-Service for priority and large-scale tasking, and
  Space Systems for customers who wish to purchase and operate their own
  Mark V class satellites. Imagery is delivered via API, FTP, and a reseller
  network, with OAuth 2.0 Client Credentials authentication against
  auth.platform.satellogic.com and product APIs under api.satellogic.com.
